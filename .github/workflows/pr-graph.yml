name: PR Graph

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download --pattern '*x86_64-unknown-linux-gnu.tar.gz'
          tar -xzf ./*-x86_64-unknown-linux-gnu.tar.gz
          chmod +x gribovik

      - name: Generate graph
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gribovik" --export review.html "$BASE" "$HEAD"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-graph-${{ github.event.pull_request.number }}
          path: review.html
          if-no-files-found: ignore
